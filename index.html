<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>indaboat Dual-Telemetry Live HUD</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #08090b; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; overflow: hidden; height: 100vh; }
    #topbar { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #111317; border-bottom: 1px solid #232731; }
    button { background: #0070e0; border: none; color: #fff; font-weight: bold; padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    button:active { filter: brightness(1.2); }
    .btn-export { background: #009955; }
    .btn-clear { background: #444; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 240px 1fr 75px 22px;
      gap: 6px;
      padding: 6px;
      height: calc(100vh - 42px);
    }

    .card { background: #0f1116; border: 1px solid #1f232c; border-radius: 5px; position: relative; overflow: hidden; }
    .card-title {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #aaa;
      z-index: 10;
      font-weight: 700;
      background: rgba(15,17,22,0.85);
      padding: 2px 6px;
      border-radius: 3px;
    }

    #map { width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }

    #hud {
      grid-column: span 2;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .badge {
      background: #0f1116;
      border: 1px solid #1f232c;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
    }
    .badge-val { font-size: 18px; font-weight: 800; color: #00ffcc; line-height: 1.1; }
    .badge-lbl { font-size: 9px; color: #777; text-transform: uppercase; margin-top: 2px; font-weight: 600; }

    #debugBar {
      grid-column: span 2;
      background: #050608;
      border: 1px solid #16181f;
      border-radius: 3px;
      padding: 2px 8px;
      font-size: 10px;
      color: #00ff88;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 18px;
    }
  </style>
</head>
<body>

<div id="topbar">
  <div style="display:flex; align-items:center; gap:8px;">
    <button id="btnConnect" onclick="toggleConnect()">CONNECT</button>
    <span id="nodeBadge" style="font-size:10px; font-weight:bold; background:#1b202c; border:1px solid #2e3547; color:#88a0cc; padding:2px 6px; border-radius:3px;">NODES: 1 (STANDALONE)</span>
  </div>
  <span id="bleStatus" style="font-size: 12px; color: #ff4444; font-weight: bold; letter-spacing: 1px;">DISCONNECTED</span>
  <div style="display: flex; gap: 6px;">
    <button class="btn-export" onclick="exportDatabase()">EXPORT (<span id="dbCount">0</span>)</button>
    <button class="btn-clear" onclick="clearDatabase()">CLEAR</button>
  </div>
</div>

<div class="grid">
  <!-- DYNAMIC 3D FORCE PLATE (CANVAS PROJECTION) -->
  <div class="card">
    <div class="card-title">3D Attitude Force Plate</div>
    <canvas id="plateCanvas"></canvas>
  </div>

  <!-- GPS SATELLITE MAP -->
  <div class="card">
    <div class="card-title" id="mapTitle">GPS Satellite Track</div>
    <div id="map"></div>
  </div>

  <!-- LOAD CELL STRIP CHART -->
  <div class="card">
    <div class="card-title" id="chartForceTitle">Dynamic Drive Force (kg)</div>
    <canvas id="chartForce"></canvas>
  </div>

  <!-- PLANAR SURGE ACCEL CHART -->
  <div class="card">
    <div class="card-title" id="chartAccelTitle">Planar Surge Accel (m/s²)</div>
    <canvas id="chartAccel"></canvas>
  </div>

  <!-- 7 METRIC BADGES -->
  <div id="hud">
    <div class="badge"><div class="badge-val" id="valRaw" style="color: #ffaa00;">--</div><div class="badge-lbl" id="lblRaw">Raw Load (kg)</div></div>
    <div class="badge"><div class="badge-val" id="valNet" style="color: #00ffcc;">--</div><div class="badge-lbl" id="lblNet">Drive Force (kg)</div></div>
    <div class="badge"><div class="badge-val" id="valSurge" style="color: #00e5ff;">--</div><div class="badge-lbl">Clean Surge (m/s²)</div></div>
    <div class="badge"><div class="badge-val" id="valSpd" style="color: #ffff00;">--</div><div class="badge-lbl">Speed (km/h)</div></div>
    <div class="badge"><div class="badge-val" id="valPitch" style="color: #ff66cc;">--</div><div class="badge-lbl">Pitch</div></div>
    <div class="badge"><div class="badge-val" id="valRoll" style="color: #cc66ff;">--</div><div class="badge-lbl">Roll</div></div>
    <div class="badge"><div class="badge-val" id="valSats" style="color: #aaa;">--</div><div class="badge-lbl">GPS Sats</div></div>
  </div>

  <!-- RAW BLE PACKET MONITOR -->
  <div id="debugBar">Awaiting BLE Connection...</div>
</div>

<script>
// ==============================================================================
// 1. INDEXEDDB PERSISTENT STORAGE
// ==============================================================================
let db;
const DB_NAME = "IndaBoatTelemetryDB";
const STORE_NAME = "records";

const dbReq = indexedDB.open(DB_NAME, 1);
dbReq.onupgradeneeded = (e) => {
  const d = e.target.result;
  if (!d.objectStoreNames.contains(STORE_NAME)) {
    d.createObjectStore(STORE_NAME, { autoIncrement: true });
  }
};
dbReq.onsuccess = (e) => {
  db = e.target.result;
  updateRecordCountDisplay();
};

function saveRowToDB(rowStr) {
  if (!db) return;
  const tx = db.transaction([STORE_NAME], "readwrite");
  tx.objectStore(STORE_NAME).add(rowStr);
}

function updateRecordCountDisplay() {
  if (!db) return;
  const tx = db.transaction([STORE_NAME], "readonly");
  const countReq = tx.objectStore(STORE_NAME).count();
  countReq.onsuccess = () => {
    document.getElementById('dbCount').innerText = countReq.result;
  };
}

function exportDatabase() {
  if (!db) return;
  const tx = db.transaction([STORE_NAME], "readonly");
  const req = tx.objectStore(STORE_NAME).getAll();
  req.onsuccess = () => {
    const rows = req.result;
    if (rows.length === 0) {
      alert("No data recorded yet.");
      return;
    }
    const blob = new Blob([rows.join('\n') + '\n'], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `indaboat_session_${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
    a.click();
  };
}

function clearDatabase() {
  if (!confirm("Clear all recorded session data?")) return;
  const tx = db.transaction([STORE_NAME], "readwrite");
  tx.objectStore(STORE_NAME).clear().onsuccess = () => {
    updateRecordCountDisplay();
  };
}

// ==============================================================================
// 2. BLE PACKET STREAM REASSEMBLER
// ==============================================================================
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let txChar = null;
let streamBuffer = "";

async function toggleConnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "indaboat" }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    txChar = await service.getCharacteristic(TX_CHAR_UUID);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', handleChunk);

    document.getElementById('bleStatus').innerText = "CONNECTED";
    document.getElementById('bleStatus').style.color = "#00ff88";
    document.getElementById('btnConnect').innerText = "DISCONNECT";

    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  } catch (err) {
    console.error(err);
    alert("Connection failed: " + err.message);
  }
}

function onDisconnected() {
  document.getElementById('bleStatus').innerText = "RECONNECTING...";
  document.getElementById('bleStatus').style.color = "#ff9900";
  document.getElementById('btnConnect').innerText = "CONNECT";
  setTimeout(attemptAutoReconnect, 2000);
}

async function attemptAutoReconnect() {
  if (!device || device.gatt.connected) return;
  try {
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    txChar = await service.getCharacteristic(TX_CHAR_UUID);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', handleChunk);

    document.getElementById('bleStatus').innerText = "CONNECTED";
    document.getElementById('bleStatus').style.color = "#00ff88";
    document.getElementById('btnConnect').innerText = "DISCONNECT";
  } catch (e) {
    setTimeout(attemptAutoReconnect, 2500);
  }
}

function handleChunk(event) {
  const text = new TextDecoder().decode(event.target.value);
  streamBuffer += text;

  const lines = streamBuffer.split(/\r?\n/);
  streamBuffer = lines.pop();

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    document.getElementById('debugBar').innerText = `RX [${trimmed.length}b]: ${trimmed}`;
    saveRowToDB(trimmed);
    parseTelemetry(trimmed);
  }
  updateRecordCountDisplay();
}

// ==============================================================================
// 3. TELEMETRY MATH & DUAL-IMU OPPOSITE-SWING FUSION
// ==============================================================================
class NodeState {
  constructor(id) {
    this.id = id;
    this.lastSeen = 0;
    this.raw_w = 0;
    this.baseline_w = null;
    this.net_force = 0;
    this.a_raw = [0, 0, 0]; // ax, ay, az
    this.g_raw = [0, 0, 0]; // gx, gy, gz (rad/s)
    this.gravity_k = [0, -1, 0]; // Dynamic vertical orientation vector
    this.pitch_est = 0;
    this.roll_est = 0;
    this.swing_rate = 0;
  }

  update(raw_w, ax, ay, az, gx, gy, gz, dt) {
    this.lastSeen = Date.now();
    this.raw_w = raw_w;
    this.a_raw = [ax, ay, az];
    this.g_raw = [gx, gy, gz];

    // Asymmetric baseline for load cell
    if (this.baseline_w === null) {
      this.baseline_w = raw_w;
    }
    const rate = raw_w > this.baseline_w ? 0.003 : 0.04;
    this.baseline_w = (1.0 - rate) * this.baseline_w + rate * raw_w;
    this.net_force = raw_w - this.baseline_w;

    // Self-aligning Gravity Vector: extracts the true 'Up' axis regardless of chip orientation
    const normA = Math.hypot(ax, ay, az);
    if (normA > 0.001) {
      const alphaG = 0.02; // Slow low-pass to find gravity
      this.gravity_k[0] = (1.0 - alphaG) * this.gravity_k[0] + alphaG * (ax / normA);
      this.gravity_k[1] = (1.0 - alphaG) * this.gravity_k[1] + alphaG * (ay / normA);
      this.gravity_k[2] = (1.0 - alphaG) * this.gravity_k[2] + alphaG * (az / normA);
      const magK = Math.hypot(this.gravity_k[0], this.gravity_k[1], this.gravity_k[2]);
      this.gravity_k = [this.gravity_k[0] / magK, this.gravity_k[1] / magK, this.gravity_k[2] / magK];
    }

    // Python axis mapping: FORWARD = X, LATERAL = Z, GRAVITY_UP = -Y
    const a_fwd = ax;
    const a_lat = az;
    const a_up  = -ay;

    const wx = gz;
    const wy = gx;

    const acc_pitch = Math.atan2(a_fwd, Math.sqrt(a_lat * a_lat + a_up * a_up));
    const acc_roll  = Math.atan2(a_lat, Math.max(0.05, a_up));

    this.pitch_est = 0.93 * (this.pitch_est + wx * dt) + 0.07 * acc_pitch;
    this.roll_est  = 0.93 * (this.roll_est  + wy * dt) + 0.07 * acc_roll;

    // Planar swing rate (angular velocity projected along normal vector)
    this.swing_rate = gx * this.gravity_k[0] + gy * this.gravity_k[1] + gz * this.gravity_k[2];
  }
}

const node1 = new NodeState(1);
const node2 = new NodeState(2);

let lastTimeSec = null;
let current_d = { pitch_deg: 0, roll_deg: 0, force_net: 0, a_surge: 0 };

const HIST_SIZE = 120;
let forceHistory = new Array(HIST_SIZE).fill(0);
let surgeHistory = new Array(HIST_SIZE).fill(0);

function parseTelemetry(row) {
  const parts = [];
  let inQuotes = false;
  let currentToken = '';

  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      parts.push(currentToken.trim());
      currentToken = '';
    } else {
      currentToken += c;
    }
  }
  parts.push(currentToken.trim());

  if (parts.length < 14) return;

  const ms    = parseInt(parts[0], 10);
  const raw_w = parseFloat(parts[2]);
  const ax    = parseFloat(parts[3]);
  const ay    = parseFloat(parts[4]);
  const az    = parseFloat(parts[5]);
  const gx    = parseFloat(parts[6]); // rad/s from Nano
  const gy    = parseFloat(parts[7]); // rad/s from Nano
  const gz    = parseFloat(parts[8]); // rad/s from Nano
  const lat   = parseFloat(parts[9]);
  const lng   = parseFloat(parts[10]);
  const spd   = parseFloat(parts[12]);
  const sats  = parseInt(parts[13], 10);

  // Optional 15th column for Multi-Node ID ("1" or "2")
  let nodeId = 1;
  if (parts.length >= 15) {
    const parsedId = parseInt(parts[14], 10);
    if (parsedId === 2) nodeId = 2;
  }

  if (isNaN(raw_w) || isNaN(ax)) return;

  const t_sec = ms / 1000.0;
  const dt = lastTimeSec === null ? 0.033 : Math.min(0.2, Math.max(0.001, t_sec - lastTimeSec));
  lastTimeSec = t_sec;

  // Ingest into target node
  if (nodeId === 1) {
    node1.update(raw_w, ax, ay, az, gx, gy, gz, dt);
  } else {
    node2.update(raw_w, ax, ay, az, gx, gy, gz, dt);
  }

  // Determine if Node 2 is actively streaming (received data within the last 1500ms)
  const isDual = (Date.now() - node2.lastSeen) < 1500;
  document.getElementById('nodeBadge').innerText = isDual ? "NODES: 2 (KINEMATIC FUSED)" : "NODES: 1 (STANDALONE)";
  document.getElementById('nodeBadge').style.color = isDual ? "#00ffcc" : "#88a0cc";

  let fusedPitch = 0.0;
  let fusedRoll  = 0.0;
  let fusedSurge = 0.0;
  let totalNetForce = 0.0;

  if (isDual) {
    // =========================================================================
    // DUAL-NODE FUSION: SHARED HEAVE/ROLL + OPPOSITE SWING CANCELLATION
    // =========================================================================
    // 1. Common-mode locked axis (Pitch and Roll are mechanically tied to hull)
    fusedPitch = (node1.pitch_est + node2.pitch_est) / 2.0;
    fusedRoll  = (node1.roll_est  + node2.roll_est)  / 2.0;

    // 2. Relative scissor swing between the two articulated members
    const diffSwingRate = (node1.swing_rate - node2.swing_rate) / 2.0;

    // 3. Isolate Boat Surge:
    // Centripetal and tangential whip cancel in the common-mode acceleration sum
    const u_up_x = Math.sin(fusedPitch);
    const a1_fwd = node1.a_raw[0];
    const a2_fwd = node2.a_raw[0];
    const commonFwd = (a1_fwd + a2_fwd) / 2.0;

    // Clean hull surge without arm whip artifacts
    fusedSurge = commonFwd - (9.80665 * u_up_x);

    // 4. Dual Load Cell Sum & Balance
    totalNetForce = node1.net_force + node2.net_force;

    document.getElementById('lblRaw').innerText = "L1 / L2 Raw";
    document.getElementById('valRaw').innerText = `${node1.raw_w.toFixed(0)} / ${node2.raw_w.toFixed(0)}`;
    document.getElementById('lblNet').innerText = "Total Drive (kg)";
    document.getElementById('valNet').innerText = (totalNetForce >= 0 ? "+" : "") + totalNetForce.toFixed(1);
    document.getElementById('chartForceTitle').innerText = `Dual Drive Force (${node1.net_force.toFixed(1)}kg : ${node2.net_force.toFixed(1)}kg)`;
  } else {
    // =========================================================================
    // SINGLE-NODE FALLBACK: 100% IDENTICAL TO ORIGINAL STANDALONE LOGIC
    // =========================================================================
    fusedPitch = node1.pitch_est;
    fusedRoll  = node1.roll_est;

    const u_up_x = Math.sin(fusedPitch);
    const u_up_y = Math.sin(fusedRoll);
    const u_up_z = Math.cos(fusedPitch) * Math.cos(fusedRoll);
    const norm_u = Math.hypot(u_up_x, u_up_y, u_up_z) || 1.0;

    fusedSurge = node1.a_raw[0] - (9.80665 * (u_up_x / norm_u));
    totalNetForce = node1.net_force;

    document.getElementById('lblRaw').innerText = "Raw Load (kg)";
    document.getElementById('valRaw').innerText = node1.raw_w.toFixed(1);
    document.getElementById('lblNet').innerText = "Drive Force (kg)";
    document.getElementById('valNet').innerText = (totalNetForce >= 0 ? "+" : "") + totalNetForce.toFixed(1);
    document.getElementById('chartForceTitle').innerText = "Dynamic Drive Force (kg)";
  }

  current_d = {
    pitch_deg: fusedPitch * (180.0 / Math.PI),
    roll_deg:  fusedRoll  * (180.0 / Math.PI),
    force_net: totalNetForce,
    a_surge:   fusedSurge
  };

  forceHistory.push(totalNetForce);
  forceHistory.shift();
  surgeHistory.push(fusedSurge);
  surgeHistory.shift();

  // Update Remaining HUD
  document.getElementById('valSurge').innerText = (fusedSurge >= 0 ? "+" : "") + fusedSurge.toFixed(2);
  document.getElementById('valSpd').innerText   = spd.toFixed(1);
  document.getElementById('valPitch').innerText = current_d.pitch_deg.toFixed(1) + "°";
  document.getElementById('valRoll').innerText  = current_d.roll_deg.toFixed(1) + "°";
  document.getElementById('valSats').innerText  = isNaN(sats) ? 0 : sats;

  // GPS Map updates
  if (lat !== 0.0 && lng !== 0.0) {
    const coord = [lat, lng];
    marker.setLatLng(coord);
    track.addLatLng(coord);
    map.panTo(coord, { animate: true, duration: 0.1 });
    document.getElementById('mapTitle').innerText = `GPS Track (${spd.toFixed(1)} km/h | ${sats} Sats)`;
  }
}

// ==============================================================================
// 4. DYNAMIC 3D MOVING FORCE PLATE (LINE-FOR-LINE PYTHON SECTION 5 PORT)
// ==============================================================================
function renderPlateCanvas() {
  const cn = document.getElementById('plateCanvas');
  const cx = cn.getContext('2d');

  const dpr = window.devicePixelRatio || 1;
  const w = cn.clientWidth;
  const h = cn.clientHeight;

  if (cn.width !== w * dpr || cn.height !== h * dpr) {
    cn.width = w * dpr;
    cn.height = h * dpr;
  }

  cx.save();
  cx.scale(dpr, dpr);
  cx.fillStyle = '#101010';
  cx.fillRect(0, 0, w, h);

  const pitch = current_d.pitch_deg * (Math.PI / 180.0);
  const roll  = current_d.roll_deg  * (Math.PI / 180.0);

  const pw = w * 0.22;
  const pl = h * 0.20;
  const pth = 10;

  const corners = [
    [-pw, -pl, -pth], [pw, -pl, -pth], [pw, pl, -pth], [-pw, pl, -pth],
    [-pw, -pl, pth],  [pw, -pl, pth],  [pw, pl, pth],  [-pw, pl, pth]
  ];

  // Rotation Matrix: Ry @ Rx
  const cosR = Math.cos(roll),  sinR = Math.sin(roll);
  const cosP = Math.cos(pitch), sinP = Math.sin(pitch);

  const rot = corners.map(c => {
    // 1. Rx
    const x1 = c[0];
    const y1 = c[1] * cosR - c[2] * sinR;
    const z1 = c[1] * sinR + c[2] * cosR;
    // 2. Ry
    const x2 = x1 * cosP + z1 * sinP;
    const y2 = y1;
    const z2 = -x1 * sinP + z1 * cosP;
    return [x2, y2, z2];
  });

  const centerX = w / 2;
  const centerY = h / 2 + 10;
  const vert_shift = Math.max(-45, Math.min(45, (current_d.force_net * -0.65) + (current_d.a_surge * 2.0)));

  const pts = rot.map(p => [
    centerX + p[0] * 0.85 - p[1] * 0.40,
    centerY + p[1] * 0.45 + p[2] + vert_shift
  ]);

  function drawPoly(indices, fillColor, strokeColor) {
    cx.beginPath();
    cx.moveTo(pts[indices[0]][0], pts[indices[0]][1]);
    for (let i = 1; i < indices.length; i++) {
      cx.lineTo(pts[indices[i]][0], pts[indices[i]][1]);
    }
    cx.closePath();
    cx.fillStyle = fillColor;
    cx.fill();
    cx.strokeStyle = strokeColor;
    cx.lineWidth = 1;
    cx.stroke();
  }

  // Draw Faces
  drawPoly([3, 2, 6, 7], '#414141', '#828282'); // Front face
  drawPoly([1, 2, 6, 5], '#5a5a5a', '#828282'); // Side face
  drawPoly([0, 1, 2, 3], '#b4961e', '#ffffff'); // Top face (gold)

  const plate_cx = (pts[0][0] + pts[2][0]) / 2;
  const plate_cy = (pts[0][1] + pts[2][1]) / 2;

  // Force vector arrow
  const arrow_len = Math.max(10, Math.min(75, Math.abs(current_d.force_net) * 1.5));
  cx.beginPath();
  cx.moveTo(plate_cx, plate_cy);
  cx.lineTo(plate_cx, plate_cy + arrow_len);
  cx.strokeStyle = '#00ff00';
  cx.lineWidth = 3;
  cx.stroke();

  // Arrowhead
  cx.beginPath();
  cx.moveTo(plate_cx - 5, plate_cy + arrow_len - 8);
  cx.lineTo(plate_cx, plate_cy + arrow_len);
  cx.lineTo(plate_cx + 5, plate_cy + arrow_len - 8);
  cx.fillStyle = '#00ff00';
  cx.fill();

  // Corner readouts matching Python
  cx.font = '10px monospace';
  cx.fillStyle = '#00e6ff';
  cx.fillText(`PITCH: ${(current_d.pitch_deg >= 0 ? '+' : '') + current_d.pitch_deg.toFixed(1)}°`, 10, h - 10);
  cx.fillStyle = '#ff64ff';
  cx.fillText(`ROLL:  ${(current_d.roll_deg >= 0 ? '+' : '') + current_d.roll_deg.toFixed(1)}°`, 120, h - 10);

  cx.restore();
}

// ==============================================================================
// 5. LEAFLET SATELLITE MAP
// ==============================================================================

// ==============================================================================
// 6. AUTO-SCALING STRIP CHARTS
// ==============================================================================
function renderLoop() {
  renderPlateCanvas();
  drawAutoScaledChart('chartForce', forceHistory, '#00ffcc', 'kg', 5.0);
  drawAutoScaledChart('chartAccel', surgeHistory, '#ffaa00', 'm/s²', 1.0);
  requestAnimationFrame(renderLoop);
}

function drawAutoScaledChart(id, arr, col, unit, minSpan) {
  const cn = document.getElementById(id);
  const cx = cn.getContext('2d');

  const dpr = window.devicePixelRatio || 1;
  const w = cn.clientWidth;
  const h = cn.clientHeight;

  if (cn.width !== w * dpr || cn.height !== h * dpr) {
    cn.width = w * dpr;
    cn.height = h * dpr;
  }

  cx.save();
  cx.scale(dpr, dpr);
  cx.clearRect(0, 0, w, h);

  const gutter = 48;
  const chartW = w - gutter - 10;
  const chartH = h - 24;
  const topPad = 16;

  let vMin = Infinity, vMax = -Infinity;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] < vMin) vMin = arr[i];
    if (arr[i] > vMax) vMax = arr[i];
  }
  if (!isFinite(vMin) || !isFinite(vMax)) { vMin = -1; vMax = 1; }

  let span = vMax - vMin;
  if (span < minSpan) {
    const mid = (vMax + vMin) / 2.0;
    vMin = mid - (minSpan / 2.0);
    vMax = mid + (minSpan / 2.0);
  } else {
    vMin -= span * 0.15;
    vMax += span * 0.15;
  }

  const ticks = 4;
  cx.font = '10px monospace';
  cx.textAlign = 'right';
  cx.textBaseline = 'middle';

  for (let i = 0; i <= ticks; i++) {
    const val = vMin + (i / ticks) * (vMax - vMin);
    const y = topPad + chartH - (i / ticks) * chartH;

    cx.strokeStyle = (Math.abs(val) < (vMax - vMin) / 20.0) ? '#384050' : '#1a1f28';
    cx.lineWidth = (Math.abs(val) < (vMax - vMin) / 20.0) ? 1.5 : 1;
    cx.beginPath();
    cx.moveTo(gutter, y);
    cx.lineTo(gutter + chartW, y);
    cx.stroke();

    cx.fillStyle = '#778899';
    cx.fillText((val >= 0 ? '+' : '') + val.toFixed(1), gutter - 6, y);
  }

  cx.strokeStyle = col;
  cx.lineWidth = 2;
  cx.beginPath();
  const step = chartW / (arr.length - 1);

  for (let i = 0; i < arr.length; i++) {
    const norm = (arr[i] - vMin) / (vMax - vMin);
    const x = gutter + i * step;
    const y = topPad + chartH - Math.max(0, Math.min(1, norm)) * chartH;

    if (i === 0) cx.moveTo(x, y);
    else cx.lineTo(x, y);
  }
  cx.stroke();

  cx.fillStyle = '#556677';
  cx.textAlign = 'left';
  cx.fillText(unit, gutter + 4, topPad + 10);

  cx.restore();
}

requestAnimationFrame(renderLoop);
</script>
