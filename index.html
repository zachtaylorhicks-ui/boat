<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>indaboat Live HUD</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #08090b; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; overflow: hidden; height: 100vh; }
    #topbar { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #111317; border-bottom: 1px solid #232731; }
    button { background: #0070e0; border: none; color: #fff; font-weight: bold; padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    button:active { filter: brightness(1.2); }
    .btn-export { background: #009955; }
    .btn-clear { background: #444; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 230px 1fr 75px 24px;
      gap: 6px;
      padding: 6px;
      height: calc(100vh - 42px);
    }

    .card { background: #0f1116; border: 1px solid #1f232c; border-radius: 5px; position: relative; overflow: hidden; }
    .card-title {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #aaa;
      z-index: 10;
      font-weight: 700;
      background: rgba(15,17,22,0.85);
      padding: 2px 6px;
      border-radius: 3px;
    }

    #map { width: 100%; height: 100%; }
    canvas { width: 100%; height: 100%; display: block; }

    #hud {
      grid-column: span 2;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .badge {
      background: #0f1116;
      border: 1px solid #1f232c;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
    }
    .badge-val { font-size: 18px; font-weight: 800; color: #00ffcc; line-height: 1.1; }
    .badge-lbl { font-size: 9px; color: #777; text-transform: uppercase; margin-top: 2px; font-weight: 600; }

    #debugBar {
      grid-column: span 2;
      background: #050608;
      border: 1px solid #16181f;
      border-radius: 3px;
      padding: 2px 8px;
      font-size: 10px;
      color: #00ff88;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 18px;
    }
  </style>
</head>
<body>

<div id="topbar">
  <button id="btnConnect" onclick="toggleConnect()">CONNECT</button>
  <span id="bleStatus" style="font-size: 12px; color: #ff4444; font-weight: bold; letter-spacing: 1px;">DISCONNECTED</span>
  <div style="display: flex; gap: 6px;">
    <button class="btn-export" onclick="exportDatabase()">EXPORT (<span id="dbCount">0</span>)</button>
    <button class="btn-clear" onclick="clearDatabase()">CLEAR</button>
  </div>
</div>

<div class="grid">
  <!-- 3D ATTITUDE FORCE PLATE -->
  <div class="card">
    <div class="card-title">3D Force Plate & Orientation</div>
    <div id="threeContainer" style="width: 100%; height: 100%;"></div>
  </div>

  <!-- GPS SATELLITE MAP -->
  <div class="card">
    <div class="card-title" id="mapTitle">GPS Satellite Track</div>
    <div id="map"></div>
  </div>

  <!-- LOAD CELL STRIP CHART -->
  <div class="card">
    <div class="card-title">Dynamic Drive Force (kg)</div>
    <canvas id="chartForce"></canvas>
  </div>

  <!-- PLANAR SURGE ACCEL CHART -->
  <div class="card">
    <div class="card-title">Planar Surge Accel (m/s²)</div>
    <canvas id="chartAccel"></canvas>
  </div>

  <!-- 7 METRIC BADGES -->
  <div id="hud">
    <div class="badge"><div class="badge-val" id="valRaw" style="color: #ffaa00;">--</div><div class="badge-lbl">Raw Load (kg)</div></div>
    <div class="badge"><div class="badge-val" id="valNet" style="color: #00ffcc;">--</div><div class="badge-lbl">Drive Force (kg)</div></div>
    <div class="badge"><div class="badge-val" id="valSurge" style="color: #00e5ff;">--</div><div class="badge-lbl">Surge (m/s²)</div></div>
    <div class="badge"><div class="badge-val" id="valSpd" style="color: #ffff00;">--</div><div class="badge-lbl">Speed (km/h)</div></div>
    <div class="badge"><div class="badge-val" id="valPitch" style="color: #ff66cc;">--</div><div class="badge-lbl">Pitch</div></div>
    <div class="badge"><div class="badge-val" id="valRoll" style="color: #cc66ff;">--</div><div class="badge-lbl">Roll</div></div>
    <div class="badge"><div class="badge-val" id="valSats" style="color: #aaa;">--</div><div class="badge-lbl">GPS Sats</div></div>
  </div>

  <!-- REAL-TIME DEBUG BAR (Shows exactly what the phone receives) -->
  <div id="debugBar">Awaiting BLE Connection...</div>
</div>

<script>
// ==============================================================================
// 1. INDEXEDDB PERSISTENT STORAGE
// ==============================================================================
let db;
const DB_NAME = "IndaBoatTelemetryDB";
const STORE_NAME = "records";

const dbReq = indexedDB.open(DB_NAME, 1);
dbReq.onupgradeneeded = (e) => {
  const d = e.target.result;
  if (!d.objectStoreNames.contains(STORE_NAME)) {
    d.createObjectStore(STORE_NAME, { autoIncrement: true });
  }
};
dbReq.onsuccess = (e) => {
  db = e.target.result;
  updateRecordCountDisplay();
};

function saveRowToDB(rowStr) {
  if (!db) return;
  const tx = db.transaction([STORE_NAME], "readwrite");
  tx.objectStore(STORE_NAME).add(rowStr);
}

function updateRecordCountDisplay() {
  if (!db) return;
  const tx = db.transaction([STORE_NAME], "readonly");
  const countReq = tx.objectStore(STORE_NAME).count();
  countReq.onsuccess = () => {
    document.getElementById('dbCount').innerText = countReq.result;
  };
}

function exportDatabase() {
  if (!db) return;
  const tx = db.transaction([STORE_NAME], "readonly");
  const req = tx.objectStore(STORE_NAME).getAll();
  req.onsuccess = () => {
    const rows = req.result;
    if (rows.length === 0) {
      alert("No data recorded yet.");
      return;
    }
    const blob = new Blob([rows.join('\n') + '\n'], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `indaboat_session_${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
    a.click();
  };
}

function clearDatabase() {
  if (!confirm("Clear all recorded session data?")) return;
  const tx = db.transaction([STORE_NAME], "readwrite");
  tx.objectStore(STORE_NAME).clear().onsuccess = () => {
    updateRecordCountDisplay();
  };
}

// ==============================================================================
// 2. BULLETPROOF BLE STREAM REASSEMBLER
// ==============================================================================
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let txChar = null;
let streamBuffer = "";

async function toggleConnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "indaboat" }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    txChar = await service.getCharacteristic(TX_CHAR_UUID);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', handleChunk);

    document.getElementById('bleStatus').innerText = "CONNECTED";
    document.getElementById('bleStatus').style.color = "#00ff88";
    document.getElementById('btnConnect').innerText = "DISCONNECT";

    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  } catch (err) {
    console.error(err);
    alert("Connection failed: " + err.message);
  }
}

function onDisconnected() {
  document.getElementById('bleStatus').innerText = "RECONNECTING...";
  document.getElementById('bleStatus').style.color = "#ff9900";
  document.getElementById('btnConnect').innerText = "CONNECT";
  setTimeout(attemptAutoReconnect, 2000);
}

async function attemptAutoReconnect() {
  if (!device || device.gatt.connected) return;
  try {
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    txChar = await service.getCharacteristic(TX_CHAR_UUID);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', handleChunk);

    document.getElementById('bleStatus').innerText = "CONNECTED";
    document.getElementById('bleStatus').style.color = "#00ff88";
    document.getElementById('btnConnect').innerText = "DISCONNECT";
  } catch (e) {
    setTimeout(attemptAutoReconnect, 2500);
  }
}

function handleChunk(event) {
  const text = new TextDecoder().decode(event.target.value);
  streamBuffer += text;

  // Split on newlines
  const lines = streamBuffer.split(/\r?\n/);
  // Keep the unfinished tail in the buffer
  streamBuffer = lines.pop();

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;

    // Show raw incoming text in debug bar
    document.getElementById('debugBar').innerText = `RX [${trimmed.length}b]: ${trimmed}`;

    saveRowToDB(trimmed);
    parseTelemetry(trimmed);
  }
  updateRecordCountDisplay();
}

// ==============================================================================
// 3. TELEMETRY PARSER (Matches Python CSV Token Extraction Exactly)
// ==============================================================================
let baselineWeight = null;
let pitch_est = 0.0, roll_est = 0.0;
let lastTimeSec = null;

const HIST_SIZE = 120;
let forceHistory = new Array(HIST_SIZE).fill(0);
let surgeHistory = new Array(HIST_SIZE).fill(0);

function parseTelemetry(row) {
  // Direct tokenization - handles "NO_GPS_TIME" or any valid ISO UTC date
  // Schema: ms, utc, weight, ax, ay, az, gx, gy, gz, lat, lng, alt, spd, sats
  const parts = [];
  let inQuotes = false;
  let currentToken = '';

  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      parts.push(currentToken.trim());
      currentToken = '';
    } else {
      currentToken += c;
    }
  }
  parts.push(currentToken.trim());

  if (parts.length < 14) return; // Incomplete line

  const ms    = parseInt(parts[0], 10);
  const raw_w = parseFloat(parts[2]);
  const ax    = parseFloat(parts[3]);
  const ay    = parseFloat(parts[4]);
  const az    = parseFloat(parts[5]);
  const gx    = parseFloat(parts[6]); // rad/s
  const gy    = parseFloat(parts[7]); // rad/s
  const gz    = parseFloat(parts[8]); // rad/s
  const lat   = parseFloat(parts[9]);
  const lng   = parseFloat(parts[10]);
  const spd   = parseFloat(parts[12]);
  const sats  = parseInt(parts[13], 10);

  if (isNaN(raw_w) || isNaN(ax)) return;

  // Asymmetric Baseline (matches Python exactly)
  if (baselineWeight === null) {
    baselineWeight = raw_w;
  }
  const rate = raw_w > baselineWeight ? 0.003 : 0.04;
  baselineWeight = (1.0 - rate) * baselineWeight + rate * raw_w;
  const net_force = raw_w - baselineWeight;

  // Time delta
  const t_sec = ms / 1000.0;
  const dt = lastTimeSec === null ? 0.033 : Math.min(0.2, Math.max(0.001, t_sec - lastTimeSec));
  lastTimeSec = t_sec;

  // Axis mapping matching your Python script:
  // FORWARD = X, LATERAL = Z, GRAVITY_UP = -Y
  const a_fwd = ax;
  const a_lat = az;
  const a_up  = -ay;

  // Gyro: Python passes rad/s to math.degrees then back to math.radians -> net effect is gyro in rad/s
  const wx = az * 0.01745;
  const wy = ax * 0.01745;

  const acc_pitch = Math.atan2(a_fwd, Math.sqrt(a_lat * a_lat + a_up * a_up));
  const acc_roll  = Math.atan2(a_lat, Math.max(0.05, a_up));

  pitch_est = 0.93 * (pitch_est + wx * dt) + 0.07 * acc_pitch;
  roll_est  = 0.93 * (roll_est  + wy * dt) + 0.07 * acc_roll;

  const u_up_x = Math.sin(pitch_est);
  const u_up_y = Math.sin(roll_est);
  const u_up_z = Math.cos(pitch_est) * Math.cos(roll_est);
  const norm_u = Math.hypot(u_up_x, u_up_y, u_up_z) || 1.0;

  const surge = a_fwd - (9.80665 * (u_up_x / norm_u));

  // Push to history
  forceHistory.push(net_force);
  forceHistory.shift();
  surgeHistory.push(surge);
  surgeHistory.shift();

  // Update HUD
  document.getElementById('valRaw').innerText   = raw_w.toFixed(1);
  document.getElementById('valNet').innerText   = (net_force >= 0 ? "+" : "") + net_force.toFixed(1);
  document.getElementById('valSurge').innerText = (surge >= 0 ? "+" : "") + surge.toFixed(2);
  document.getElementById('valSpd').innerText   = spd.toFixed(1);
  document.getElementById('valPitch').innerText = (pitch_est * (180.0 / Math.PI)).toFixed(1) + "°";
  document.getElementById('valRoll').innerText  = (roll_est * (180.0 / Math.PI)).toFixed(1) + "°";
  document.getElementById('valSats').innerText  = isNaN(sats) ? 0 : sats;

  // 3D Plate updates
  plateMesh.rotation.x = -pitch_est;
  plateMesh.rotation.z = roll_est;

  const clampedF = Math.min(60.0, Math.max(-20.0, net_force));
  plateMesh.position.y = (clampedF * -0.015) + (surge * 0.04);

  const arrowLen = Math.min(2.5, Math.max(0.1, Math.abs(net_force) * 0.05));
  arrow.setLength(arrowLen, arrowLen * 0.25, arrowLen * 0.15);

  // GPS Map updates
  if (lat !== 0.0 && lng !== 0.0) {
    const coord = [lat, lng];
    marker.setLatLng(coord);
    track.addLatLng(coord);
    map.panTo(coord, { animate: true, duration: 0.1 });
    document.getElementById('mapTitle').innerText = `GPS Track (${spd.toFixed(1)} km/h | ${sats} Sats)`;
  }
}

// ==============================================================================
// 4. THREE.JS 3D FORCE PLATE
// ==============================================================================
const c3d = document.getElementById('threeContainer');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, c3d.clientWidth / c3d.clientHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(c3d.clientWidth, c3d.clientHeight);
c3d.appendChild(renderer.domElement);

const boxGeo = new THREE.BoxGeometry(2.2, 0.15, 1.3);
const boxMats = [
  new THREE.MeshBasicMaterial({ color: 0x404040 }),
  new THREE.MeshBasicMaterial({ color: 0x404040 }),
  new THREE.MeshBasicMaterial({ color: 0xd4a017 }),
  new THREE.MeshBasicMaterial({ color: 0x202020 }),
  new THREE.MeshBasicMaterial({ color: 0x505050 }),
  new THREE.MeshBasicMaterial({ color: 0x505050 })
];
const plateMesh = new THREE.Mesh(boxGeo, boxMats);
scene.add(plateMesh);

const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 0, 0), 0.5, 0x00ff88);
scene.add(arrow);

const gridHelper = new THREE.GridHelper(4, 10, 0x333333, 0x1a1a1a);
gridHelper.position.y = -0.8;
scene.add(gridHelper);

camera.position.set(2.8, 2.2, 3.4);
camera.lookAt(0, -0.2, 0);

window.addEventListener('resize', () => {
  camera.aspect = c3d.clientWidth / c3d.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(c3d.clientWidth, c3d.clientHeight);
});

// ==============================================================================
// 5. LEAFLET SATELLITE MAP
// ==============================================================================
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([21.2888, -157.8237], 17);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19
}).addTo(map);

const track = L.polyline([], { color: '#00e5ff', weight: 3 }).addTo(map);
const marker = L.circleMarker([0, 0], { radius: 6, color: '#ff1100', fillColor: '#ffff00', fillOpacity: 1 }).addTo(map);

// ==============================================================================
// 6. AUTO-SCALING STRIP CHARTS
// ==============================================================================
function renderLoop() {
  drawAutoScaledChart('chartForce', forceHistory, '#00ffcc', 'kg', 5.0);
  drawAutoScaledChart('chartAccel', surgeHistory, '#ffaa00', 'm/s²', 1.0);
  renderer.render(scene, camera);
  requestAnimationFrame(renderLoop);
}

function drawAutoScaledChart(id, arr, col, unit, minSpan) {
  const cn = document.getElementById(id);
  const cx = cn.getContext('2d');

  const dpr = window.devicePixelRatio || 1;
  const w = cn.clientWidth;
  const h = cn.clientHeight;

  if (cn.width !== w * dpr || cn.height !== h * dpr) {
    cn.width = w * dpr;
    cn.height = h * dpr;
  }

  cx.save();
  cx.scale(dpr, dpr);
  cx.clearRect(0, 0, w, h);

  const gutter = 48;
  const chartW = w - gutter - 10;
  const chartH = h - 24;
  const topPad = 16;

  let vMin = Infinity, vMax = -Infinity;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] < vMin) vMin = arr[i];
    if (arr[i] > vMax) vMax = arr[i];
  }
  if (!isFinite(vMin) || !isFinite(vMax)) { vMin = -1; vMax = 1; }

  let span = vMax - vMin;
  if (span < minSpan) {
    const mid = (vMax + vMin) / 2.0;
    vMin = mid - (minSpan / 2.0);
    vMax = mid + (minSpan / 2.0);
  } else {
    vMin -= span * 0.15;
    vMax += span * 0.15;
  }

  const ticks = 4;
  cx.font = '10px monospace';
  cx.textAlign = 'right';
  cx.textBaseline = 'middle';

  for (let i = 0; i <= ticks; i++) {
    const val = vMin + (i / ticks) * (vMax - vMin);
    const y = topPad + chartH - (i / ticks) * chartH;

    cx.strokeStyle = (Math.abs(val) < (vMax - vMin) / 20.0) ? '#384050' : '#1a1f28';
    cx.lineWidth = (Math.abs(val) < (vMax - vMin) / 20.0) ? 1.5 : 1;
    cx.beginPath();
    cx.moveTo(gutter, y);
    cx.lineTo(gutter + chartW, y);
    cx.stroke();

    cx.fillStyle = '#778899';
    cx.fillText((val >= 0 ? '+' : '') + val.toFixed(1), gutter - 6, y);
  }

  cx.strokeStyle = col;
  cx.lineWidth = 2;
  cx.beginPath();
  const step = chartW / (arr.length - 1);

  for (let i = 0; i < arr.length; i++) {
    const norm = (arr[i] - vMin) / (vMax - vMin);
    const x = gutter + i * step;
    const y = topPad + chartH - Math.max(0, Math.min(1, norm)) * chartH;

    if (i === 0) cx.moveTo(x, y);
    else cx.lineTo(x, y);
  }
  cx.stroke();

  cx.fillStyle = '#556677';
  cx.textAlign = 'left';
  cx.fillText(unit, gutter + 4, topPad + 10);

  cx.restore();
}

requestAnimationFrame(renderLoop);
</script>
</body>
</html>
